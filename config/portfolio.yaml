portfolio_version: portfolio-v2
seed: 42
profile: "European wholesale bank with CEE and emerging-market corporate lending, a sovereign and corporate bond book, rates hedges and a small listed-equity sleeve. The CEE/EM tilt (RU, UA, PL, TR) is intentional so regional shocks are visible; the same book is run unchanged on every window."
beta_estimation:
  returns_file: market/returns_daily_2021.csv
  market: "^GSPC"
  method: OLS slope of daily returns on the S&P 500 over calendar 2021 (before every test window)
currency: USD
ranges:
  loan_notional_musd: [60, 260]
  loan_maturity_years: [1, 7]
  bond_notional_musd: [30, 160]
  bond_maturity_years: [2, 12]
  bond_price_pct: [94.0, 103.0]
  irs_notional_musd: [150, 450]
  irs_maturity_years: [2, 10]
  equity_value_musd: [15, 70]
lgd:
  secured: 0.30
  unsecured: 0.45
yield_for_convexity: 0.04
frn_rate_duration: 0.25
loans:
  - {sector: energy, country: RU, rating: BB+, secured: false}
  - {sector: financials, country: RU, rating: BBB-, secured: false}
  - {sector: energy, country: DE, rating: A-, secured: true}
  - {sector: energy, country: US, rating: BBB, secured: true}
  - {sector: utilities, country: DE, rating: BBB+, secured: true}
  - {sector: industrials, country: PL, rating: BBB-, secured: false}
  - {sector: materials, country: UA, rating: B, secured: true}
  - {sector: financials, country: GB, rating: A, secured: false}
  - {sector: consumer, country: IN, rating: BBB-, secured: false}
  - {sector: real_estate, country: US, rating: BB, secured: true}
  - {sector: technology, country: US, rating: A+, secured: false}
  - {sector: industrials, country: TR, rating: B+, secured: true}
bonds:
  - {sector: sovereign, country: US, rating: AA+, coupon_type: fixed}
  - {sector: sovereign, country: DE, rating: AAA, coupon_type: fixed}
  - {sector: sovereign, country: IT, rating: BBB, coupon_type: fixed}
  - {sector: sovereign, country: RU, rating: BBB-, coupon_type: fixed}
  - {sector: sovereign, country: TR, rating: B+, coupon_type: fixed}
  - {sector: energy, country: US, rating: BBB+, coupon_type: fixed}
  - {sector: energy, country: GB, rating: A, coupon_type: fixed}
  - {sector: financials, country: US, rating: A-, coupon_type: frn}
  - {sector: financials, country: FR, rating: A, coupon_type: frn}
  - {sector: utilities, country: FR, rating: BBB, coupon_type: fixed}
  - {sector: materials, country: PL, rating: BB, coupon_type: fixed}
  - {sector: consumer, country: US, rating: BB-, coupon_type: frn}
irs:
  - {direction: payer}
  - {direction: payer}
  - {direction: payer}
  - {direction: receiver}
  - {direction: receiver}
  - {direction: receiver}
equities:
  - {ticker: TSLA}
  - {ticker: AAPL}
  - {ticker: MSFT}
  - {ticker: AMZN}
  - {ticker: TSM}
  - {ticker: META}
  - {ticker: KO}
  - {ticker: BA}
  - {ticker: NOC}
  - {ticker: F}
options:
  underlying_price: 100.0
  multiplier: 100
  risk_free_rate: 0.01
  positions:
    - {ticker: TSLA, option_type: put, contracts: 1500, strike_pct: 0.90, expiry_years: 0.25, implied_vol: 0.60}
    - {ticker: AAPL, option_type: put, contracts: 4000, strike_pct: 0.95, expiry_years: 0.50, implied_vol: 0.30}
    - {ticker: MSFT, option_type: call, contracts: 3000, strike_pct: 1.05, expiry_years: 0.50, implied_vol: 0.28}
    - {ticker: BA, option_type: call, contracts: -2000, strike_pct: 1.10, expiry_years: 0.25, implied_vol: 0.45}
