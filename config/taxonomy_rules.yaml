classes:
  geopolitical: Geopolitical
  macroeconomic: Macroeconomic
  credit_event: Credit Event
  commodity_energy: Commodity/Energy
  regulatory: Regulatory
  merger_acquisition: Merger/Acquisition
  earnings_corporate: Earnings/Corporate
  product_launch: Product Launch
  other: Other
priority:
  - credit_event
  - geopolitical
  - macroeconomic
  - commodity_energy
  - regulatory
  - merger_acquisition
  - earnings_corporate
  - product_launch
  - other
min_score: 1.0
scope_precedence:
  default: [single_name, sector, country, macro]
  geopolitical: [country, sector, single_name, macro]
  macroeconomic: [macro, country, sector, single_name]
  commodity_energy: [sector, country, single_name, macro]
  credit_event: [single_name, country, sector, macro]
actor_countries: [country:US, country:EU, country:GB]
primary_target_only_classes: [credit_event]
confidence_saturation: 2.0
context_excludes:
  - '\b(e-?sports?|#?sixinvitational|invitational|scrims?|valorant|league of legends|cs:?go|rainbow six|world champions?|grand final|playoffs?|premier league|champions league|world cup|super bowl|nba|nfl|ipl)\b'
  - '\b(out-?fragged|fragged|the match|map \d|one more map)\b'
rules:
  - id: GEO-001
    class: geopolitical
    weight: 2.0
    patterns: ['\binvad(e|es|ed|ing)\b', '\binvasion\b']
  - id: GEO-002
    class: geopolitical
    weight: 1.5
    patterns: ['\bsanction(s|ed|ing)?\b', '\bembargo(es)?\b']
  - id: GEO-003
    class: geopolitical
    weight: 1.5
    patterns: ['\b(war|warfare|military|troops|missiles?|shelling|airstrikes?|attack(s|ed)?|drones? strikes?)\b']
    exclude_patterns: ['\b(heart|panic|asthma) attacks?\b', '\bprice war\b', '\bwar for talent\b', '\bstar wars\b']
  - id: GEO-004
    class: geopolitical
    weight: 1.0
    patterns: ['\b(nato|ceasefire|peace talks|refugees?|annex(ation|ed)?|conflict|tensions?|diplomat(s|ic)?|kremlin|peacekeep(ing|ers)|security council|united nations)\b']
  - id: GEO-005
    class: geopolitical
    weight: 1.0
    patterns: ['\bswift\b', '\bexport controls?\b', '\basset freezes?\b', '\bfrozen reserves\b', '\b(seiz(e|es|ed|ure|ures)|oligarchs?)\b']
  - id: GEO-006
    class: geopolitical
    weight: 1.5
    patterns: ['\b(fighting|offensive|siege|bomb(s|ing|ed)?|shell(s|ed)|killed|casualties|escalat\w+|rebels?|separatists?|weapons?|arms (deals?|supplies|shipments)|nuclear (plant|power plant|facilit\w+)|no-fly zone)\b']
    exclude_patterns: ['\b(convicted|murder(ed|er)?|homicide|manslaughter|ex-officer|police officer|carjack\w*|sentenced|gunman|school shooting)\b']
  - id: GEO-007
    class: geopolitical
    weight: 1.0
    patterns: ['\b(russia|russian|ukraine|ukrainian|ukrainians|kyiv|kiev|putin|zelensk\w*|mariupol|kharkiv|donbas|taiwan strait|north korea|pyongyang|tehran|iranian|gaza|hamas|hezbollah|houthis?)\b']
    exclude_patterns: ['\b(start-?up|raises \$|funding round)\b']
  - id: MAC-001
    class: macroeconomic
    weight: 2.0
    patterns: ['\b(rate hikes?|raises? (interest )?rates|hikes? (interest )?rates|rate increases?|basis[- ]points?|bps)\b', '\b(key|policy|benchmark) (interest )?rates?\b', '\binterest rates?\b']
  - id: MAC-002
    class: macroeconomic
    weight: 1.5
    patterns: ['\b(inflation|cpi|consumer prices|stagflation)\b']
  - id: MAC-003
    class: macroeconomic
    weight: 1.0
    patterns: ['\b(gdp|recession|unemployment|jobs report|jobless claims|payrolls|economic growth|slowdown|industrial production|current account|trade (deficit|surplus|balance)|retail sales|consumer confidence|pmi)\b', '\badds? [\d,]+ (jobs|positions)\b', '\bmanufacturing (gauge|index|activity|output|pmi)\b', '\btax (buoyancy|collections?|revenues?)\b']
  - id: MAC-004
    class: macroeconomic
    weight: 1.0
    patterns: ['\b(treasury yields?|bond yields?|yield curve|monetary policy|quantitative tightening|tightening)\b']
  - id: MAC-005
    class: macroeconomic
    weight: 1.0
    patterns: ['\b(rouble|ruble|rupee|yuan|yen|sterling|euro|dollar index|exchange rate|currency|forex|capital controls)\b']
  - id: MAC-006
    class: macroeconomic
    weight: 2.0
    patterns: ['\b(fed|federal reserve|fomc|ecb|bank of england|boe|rbi|boj|bank of japan|pboc|central banks?|powell|lagarde)\b']
    exclude_patterns: ['\bfed up\b', '\bfed ex\b', '\bfedex\b']
  - id: CRD-001
    class: credit_event
    weight: 2.5
    direction: negative
    patterns: ['\b(debt|bond|sovereign|technical|selective|payment) default\b', '\bdefault(s|ed|ing)? on\b', '\bdefault risk\b', '\b(avert(s|ed)?|avoid(s|ed)?|risk of|edge of|brink of|nears?|imminent|may|could|likely to|in|towards?|into) (a )?default\b', '\bdefault (is |looks )?(imminent|looms|likely)\b', '\bmissed (a )?(coupon|payment|interest payment)\b']
    exclude_patterns: ['\b(student loans?|credit cards?|mortgages?|car loans?|auto loans?|personal loans?|tenants?|rent payments?)\b']
  - id: CRD-002
    class: credit_event
    weight: 2.0
    direction: negative
    patterns: ['\bdowngrad(e|es|ed|ing)\b.{0,40}\b(junk|credit|sovereign|rating|ratings|outlook|debt|bonds?|aaa|aa|bbb|bb|ccc|cc|baa\d|ba\d|caa\d)\b', '\b(cut|cuts|slash(es|ed)?|lower(s|ed)?)\b.{0,30}\bratings?\b', '\bjunk status\b', '\b(cut|cuts|downgraded|lowered|slashed|pushed|pushes)\b.{0,15}\b(to|into|further into)\W{0,2}junk\b', '\bratings? (cut|cuts|lowered|downgraded|slashed)\b', '\bcredit ?watch negative\b', '\bnegative outlook\b']
    exclude_patterns: ['\banalysts?\b', '\b(stock|shares|price target|buy|sell|hold|outperform|underperform|overweight|underweight|equal-weight)\b']
  - id: CRD-003
    class: credit_event
    weight: 2.0
    direction: negative
    patterns: ['\b(bankrupt(cy)?|insolven(t|cy)|chapter 11|debt restructuring|restructur\w+ (its |of )?debt|receivership|administration proceedings)\b']
  - id: CRD-004
    class: credit_event
    weight: 1.0
    patterns: ['\b(credit spreads?|bond spreads?|credit default swaps?|cds|junk bonds?|high-yield bonds?|distressed debt)\b']
  - id: CRD-005
    class: credit_event
    weight: 0.5
    patterns: ['\b(moody.?s|fitch|s&p global ratings|credit rating agenc(y|ies))\b']
    exclude_patterns: ['\bmoody.?s analytics\b']
  - id: CRD-006
    class: credit_event
    weight: 2.0
    direction: positive
    patterns: ['\bupgrad(e|es|ed|ing)\b.{0,40}\b(credit|sovereign|rating|ratings|outlook|debt|bonds?|aaa|aa|bbb|bb|baa\d|ba\d)\b', '\bpositive outlook\b', '\bcredit ?watch positive\b']
    exclude_patterns: ['\banalysts?\b', '\b(stock|shares|price target|buy|sell|hold|outperform|underperform|overweight|underweight|equal-weight)\b']
  - id: COM-001
    class: commodity_energy
    weight: 1.5
    patterns: ['\b(oil|crude|brent|wti|natural gas|lng|gasoline|gas prices?|gas supplies|russian gas|petrol|diesel|fuel prices?|pump prices?|pipeline)\b']
  - id: COM-002
    class: commodity_energy
    weight: 1.0
    patterns: ['\b(wheat|nickel|aluminium|aluminum|palladium|metals|commodit(y|ies)|fertili[sz]er|grain|copper|coal|gold|silver|platinum)\b']
  - id: COM-003
    class: commodity_energy
    weight: 1.0
    patterns: ['\b(opec\+?|barrel|energy prices|energy crisis|energy supplies|supply shock|price spike)\b']
  - id: REG-001
    class: regulatory
    weight: 1.5
    patterns: ['\b(regulators?|regulatory|antitrust|watchdog|sec|ftc|doj|cma|competition (commission|authority)|fined|fines|penalty)\b', '\bprobe (into|of)\b']
    exclude_patterns: ['\b(masks?|passengers?|parking|speeding|traffic) (fines?|violations?)\b', '\bmask violations?\b']
  - id: REG-002
    class: regulatory
    weight: 1.0
    patterns: ['\b(new rules?|legislation|bill passes|crackdown|compliance|approval from regulators|license revoked|tariff order)\b', '\b(court|judge) (rules?|ruled|blocks?|blocked|orders?|ordered|said)\b', '\bapprov(al|es|ed|ing) (process|of the|for the)\b', '\b(apex|supreme|high) court\b']
  - id: REG-003
    class: regulatory
    weight: 0.5
    patterns: ['\b(lawsuit|sues|sued|litigation|settlement)\b']
    exclude_patterns: ['\b(jury awards?|wrongful death|murder|convicted|divorce)\b']
  - id: REG-004
    class: regulatory
    weight: 2.5
    patterns: ['\b(class action|shareholder (alert|investigation|lawsuit)|encourages investors to contact|investigates (the )?(merger|sale|proposed))\b']
  - id: MNA-001
    class: merger_acquisition
    weight: 2.0
    patterns: ['\b(acquir(e|es|ed|ing)|acquisition|takeover|merger|buyout)\b', '\b(agree(s|d)?|deal|plans?|offer(s|ed)?|bid) to (buy|acquire|purchase)\b']
  - id: MNA-002
    class: merger_acquisition
    weight: 1.0
    patterns: ['\b(deal valued|all-cash deal|cash-and-stock deal|bid for|stake in|tender offer)\b']
    exclude_patterns: ['\bbid for (fast-track )?(membership|eu|nato|asylum|re-?election|office|independence|presidency|power)\b']
  - id: ERN-001
    class: earnings_corporate
    weight: 1.5
    patterns: ['\b(earnings|quarterly results|revenue|profit|eps|guidance|beats estimates|misses estimates|net (profit|loss)|operating (profit|income|result)|q[1-4] (results|20\d\d)|financial results|analyst estimates)\b', '\bresults for (q[1-4]|the (fourth|third|second|first) quarter|fiscal|fy)\b', '\b(record|record-setting) (results|revenue|profit|quarter)\b', '\bsees (fy|full[- ]year|20\d\d)\b']
  - id: ERN-002
    class: earnings_corporate
    weight: 1.0
    patterns: ['\b(stock split|buyback|dividend|layoffs|ceo|cfo|coo|chief (executive|financial|operating) officer|appoints?|resigns?|steps down|ipo|initial public offering|deliveries|partnership|partners with)\b', '\b(approval|approved|plans?) to list\b', '\blisting on\b']
    exclude_patterns: ['\bformer (ceo|cfo|coo|chief)\b']
  - id: ERN-003
    class: earnings_corporate
    weight: 2.0
    patterns: ['\bprice target\b', '\b(upgrade|downgrade)[sd]?\b.{0,40}\b(buy|sell|hold|neutral|outperform|underperform|overweight|underweight|equal-weight)\b', '\banalysts? (say|says|see|expect)\b', '\b(cuts?|raises?|lifts?|trims?|moves?)\b.{0,40}\bto \W?(underweight|overweight|outperform|underperform|equal-weight|market-weight)\b', '\banalyst cut\w* (his|her|their) rating\b']
  - id: ERN-004
    class: earnings_corporate
    weight: 1.5
    patterns: ['\b(shares|stock|stocks)\b.{0,30}\b(soar(s|ed|ing)?|jump(s|ed)?|surge[sd]?|rall(y|ies|ied)|plunge[sd]?|tumble[sd]?|slump(s|ed)?|underperform(s|ed)?|outperform(s|ed|ance)?|hits? (a )?(new )?(high|low)s?)\b']
    exclude_patterns: ['\b(stocks|markets|wall street|indexes|indices|sensex|nifty|ftse|dax|nikkei|s&p 500|nasdaq|dow)\b.{0,15}\b(rall(y|ies|ied)|tumble[sd]?|plunge[sd]?|slump(s|ed)?)\b']
  - id: ERN-005
    class: earnings_corporate
    weight: 1.0
    patterns: ['\bto (set up|build|open) (a |its |new |two |three )?(plant|factory|facility|office|unit|data cent(er|re)s?)\b', '\b(regional hq|new (plant|factory|headquarters)|gigafactory|data cent(er|re)s?)\b']
  - id: PRD-001
    class: product_launch
    weight: 1.5
    patterns: ['\b(launch(es|ed)?|unveil(s|ed)?|introduc(es|ed)|rolls? out|new model|release(s|d)?)\b(?!.{0,30}\b(invasion|attacks?|offensive|assault|strikes?|missiles?|operation|probe|investigation|sanctions?|war|crackdown|counter-?offensive)\b)']
    exclude_patterns: ['\b(my|her|his|our) new\b', '\breleased from\b', '\bprisoners? released\b']
  - id: PRD-002
    class: product_launch
    weight: 1.5
    patterns: ['\bbeta (version|build|release)\b', '\bbeta \d+(\.\d+)+\b', '\b(ios|android|windows) \d+(\.\d+)?\b', '\bproduct launch\b', '\blaunch event\b']
