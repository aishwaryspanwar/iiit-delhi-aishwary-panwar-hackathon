classes:
  geopolitical: Geopolitical
  macroeconomic: Macroeconomic
  credit_event: Credit Event
  commodity_energy: Commodity/Energy
  regulatory: Regulatory
  merger_acquisition: Merger/Acquisition
  earnings_corporate: Earnings/Corporate
  product_launch: Product Launch
  other: Other
priority:
  - credit_event
  - geopolitical
  - macroeconomic
  - commodity_energy
  - regulatory
  - merger_acquisition
  - earnings_corporate
  - product_launch
  - other
min_score: 1.0
scope_precedence:
  default: [single_name, sector, country, macro]
  geopolitical: [country, sector, single_name, macro]
  macroeconomic: [macro, country, sector, single_name]
  commodity_energy: [sector, country, single_name, macro]
  credit_event: [single_name, country, sector, macro]
actor_countries: [country:US, country:EU, country:GB]
confidence_saturation: 2.0
rules:
  - id: GEO-001
    class: geopolitical
    weight: 2.0
    patterns: ['\binvad(e|es|ed|ing)\b', '\binvasion\b']
  - id: GEO-002
    class: geopolitical
    weight: 1.5
    patterns: ['\bsanction(s|ed|ing)?\b', '\bembargo(es)?\b']
  - id: GEO-003
    class: geopolitical
    weight: 1.5
    patterns: ['\b(war|warfare|military|troops|missiles?|shelling|airstrikes?|attack(s|ed)?)\b']
  - id: GEO-004
    class: geopolitical
    weight: 1.0
    patterns: ['\b(nato|ceasefire|peace talks|refugees?|annex(ation|ed)?|conflict|tensions?|diplomat(s|ic)?|kremlin)\b']
  - id: GEO-005
    class: geopolitical
    weight: 1.0
    patterns: ['\bswift\b', '\bexport controls?\b', '\basset freezes?\b', '\bfrozen reserves\b', '\b(seiz(e|es|ed|ure|ures)|oligarchs?)\b']
  - id: GEO-006
    class: geopolitical
    weight: 1.5
    patterns: ['\b(fighting|offensive|siege|bomb(s|ing|ed)?|shell(s|ed)|killed|casualties|escalat\w+|rebels?|separatists?|weapons?|arms (deals?|supplies|shipments)|nuclear (plant|power plant|facilit\w+)|no-fly zone)\b']
  - id: MAC-001
    class: macroeconomic
    weight: 2.0
    patterns: ['\b(rate hikes?|raises? (interest )?rates|hikes? (interest )?rates|rate increases?|basis[- ]points?|bps)\b', '\b(key|policy|benchmark) (interest )?rates?\b', '\binterest rates?\b']
  - id: MAC-002
    class: macroeconomic
    weight: 1.5
    patterns: ['\b(inflation|cpi|consumer prices|stagflation)\b']
  - id: MAC-003
    class: macroeconomic
    weight: 1.0
    patterns: ['\b(gdp|recession|unemployment|jobs report|payrolls|economic growth|slowdown)\b']
  - id: MAC-004
    class: macroeconomic
    weight: 1.0
    patterns: ['\b(treasury yields?|bond yields?|yield curve|monetary policy|quantitative tightening|tightening)\b']
  - id: MAC-005
    class: macroeconomic
    weight: 1.0
    patterns: ['\b(rouble|ruble|rupee|yuan|yen|sterling|euro|dollar index|exchange rate|currency|forex|capital controls)\b']
  - id: CRD-001
    class: credit_event
    weight: 2.5
    patterns: ['\b(debt|bond|sovereign|technical|selective|payment) default\b', '\bdefault(s|ed|ing)? on\b', '\bdefault risk\b', '\b(avert(s|ed)?|avoid(s|ed)?|risk of|edge of|brink of|nears?|imminent|may|could|likely to|in) (a )?default\b', '\bdefault (is |looks )?(imminent|looms|likely)\b', '\bmissed (a )?(coupon|payment|interest payment)\b']
  - id: CRD-002
    class: credit_event
    weight: 2.0
    patterns: ['\bdowngrad(e|es|ed|ing)\b.{0,40}\b(junk|credit|sovereign|rating|ratings|outlook|debt|bonds?|aaa|aa|bbb|bb|ccc|cc|baa\d|ba\d|caa\d)\b', '\b(cut|cuts|slash(es|ed)?|lower(s|ed)?)\b.{0,30}\bratings?\b', '\bjunk status\b', '\b(cut|cuts|downgraded|lowered|slashed|pushed|pushes)\b.{0,15}\b(to|into|further into)\W{0,2}junk\b', '\bratings? (cut|cuts|lowered|downgraded|slashed)\b', '\bcredit ?watch\b', '\bnegative outlook\b']
  - id: CRD-003
    class: credit_event
    weight: 2.0
    patterns: ['\b(bankrupt(cy)?|insolven(t|cy)|chapter 11|debt restructuring|restructur\w+ (its |of )?debt|receivership|administration proceedings)\b']
  - id: CRD-004
    class: credit_event
    weight: 1.0
    patterns: ['\b(credit spreads?|bond spreads?|credit default swaps?|cds|junk bonds?|high-yield bonds?|distressed debt)\b']
  - id: CRD-005
    class: credit_event
    weight: 1.0
    patterns: ['\b(moody.?s|fitch|s&p global ratings|credit rating agenc(y|ies))\b']
  - id: COM-001
    class: commodity_energy
    weight: 1.5
    patterns: ['\b(oil|crude|brent|wti|natural gas|lng|gasoline|gas prices?|gas supplies|russian gas|petrol|diesel|fuel prices?|pipeline)\b']
  - id: COM-002
    class: commodity_energy
    weight: 1.0
    patterns: ['\b(wheat|nickel|aluminium|aluminum|palladium|metals|commodit(y|ies)|fertili[sz]er|grain|copper|coal)\b']
  - id: COM-003
    class: commodity_energy
    weight: 1.0
    patterns: ['\b(opec\+?|barrel|energy prices|energy crisis|energy supplies|supply shock|price spike)\b']
  - id: REG-001
    class: regulatory
    weight: 1.5
    patterns: ['\b(regulators?|regulatory|antitrust|watchdog|sec|ftc|doj|cma|competition (commission|authority)|fined|fines|penalty)\b', '\bprobe (into|of)\b']
  - id: REG-002
    class: regulatory
    weight: 1.0
    patterns: ['\b(new rules?|legislation|bill passes|crackdown|compliance|approval from regulators|license revoked|lawsuit|sues|sued)\b']
  - id: MNA-001
    class: merger_acquisition
    weight: 2.0
    patterns: ['\b(acquir(e|es|ed|ing)|acquisition|takeover|merger|buyout)\b', '\b(agree(s|d)?|deal|plans?|offer(s|ed)?|bid) to (buy|acquire|purchase)\b']
  - id: MNA-002
    class: merger_acquisition
    weight: 1.0
    patterns: ['\b(deal valued|all-cash deal|cash-and-stock deal|bid for|stake in|tender offer)\b']
  - id: ERN-001
    class: earnings_corporate
    weight: 1.5
    patterns: ['\b(earnings|quarterly results|revenue|profit|eps|guidance|beats estimates|misses estimates|net (profit|loss)|operating (profit|income|result)|q[1-4] (results|20\d\d)|financial results)\b']
  - id: ERN-002
    class: earnings_corporate
    weight: 1.0
    patterns: ['\b(stock split|buyback|dividend|layoffs|ceo|cfo|appoints?|resigns?|steps down|ipo|initial public offering|deliveries|partnership|partners with)\b']
  - id: ERN-003
    class: earnings_corporate
    weight: 2.0
    patterns: ['\bprice target\b', '\b(upgrade|downgrade)[sd]?\b.{0,40}\b(buy|sell|hold|neutral|outperform|underperform|overweight|underweight|equal-weight)\b', '\banalysts? (say|says|see|expect)\b']
  - id: PRD-001
    class: product_launch
    weight: 1.5
    patterns: ['\b(launch(es|ed)?|unveil(s|ed)?|introduc(es|ed)|rolls? out|new model|release(s|d)?)\b']
